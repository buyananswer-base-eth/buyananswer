<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glowA" cx="16%" cy="6%" r="62%">
      <stop offset="0%" stop-color="#ccf94b" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#ccf94b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="96%" cy="82%" r="58%">
      <stop offset="0%" stop-color="#ff6b47" stop-opacity="0.18"/>
      <stop offset="62%" stop-color="#ff6b47" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0e0d0a"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <!-- wordmark -->
  <g transform="translate(80,72)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#ccf94b" transform="rotate(-8 17 17)"/>
    <text x="50" y="26" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" fill="#f6f2e6">BuyAnAnswer</text>
  </g>

  <!-- headline -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" fill="#f6f2e6">
    <text x="80" y="248" font-size="70">Your link in bio,</text>
    <text x="80" y="330" font-size="70">but every tip</text>
    <rect x="72" y="356" width="720" height="66" rx="7" fill="#ccf94b"/>
    <text x="82" y="410" font-size="70" fill="#16170b">buys a real answer.</text>
  </g>

  <!-- sub tagline -->
  <text x="82" y="486" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="27" fill="#c9c2b0">Fans pay to ask. You get paid to answer — in USDC on Base.</text>

  <!-- trust line -->
  <text x="82" y="552" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="22" fill="#8f8672">Held onchain   ·   USDC on Base   ·   Refunded if unanswered</text>
</svg>
