<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glowA" cx="16%" cy="6%" r="62%">
      <stop offset="0%" stop-color="#ccf94b" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#ccf94b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="96%" cy="82%" r="58%">
      <stop offset="0%" stop-color="#ff6b47" stop-opacity="0.18"/>
      <stop offset="62%" stop-color="#ff6b47" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0e0d0a"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <!-- wordmark -->
  <g transform="translate(80,72)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#ccf94b" transform="rotate(-8 17 17)"/>
    <text x="50" y="26" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" fill="#f6f2e6">BuyAnAnswer</text>
  </g>

  <!-- check chip -->
  <g transform="translate(80,150)">
    <circle cx="30" cy="30" r="30" fill="#ccf94b"/>
    <path d="M17 31 l9 9 l17 -19" fill="none" stroke="#16170b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- headline -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" fill="#f6f2e6">
    <text x="80" y="316" font-size="72">Sent — your money is</text>
    <rect x="72" y="342" width="620" height="66" rx="7" fill="#ccf94b"/>
    <text x="82" y="396" font-size="72" fill="#16170b">held onchain</text>
    <text x="712" y="396" font-size="72">until</text>
    <text x="80" y="480" font-size="72">they answer.</text>
  </g>

  <!-- trust line -->
  <text x="82" y="560" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="23" fill="#8f8672">You only pay for answers   ·   Refunded if they don't   ·   Appears shortly</text>
</svg>
