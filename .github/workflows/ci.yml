name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── JavaScript / TypeScript monorepo: install → lint → typecheck → test → build ──
  node:
    name: node (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the internal libraries first: consumers (workers/*, apps/web) import
      # `@buyananswer/shared` via its package `exports` → `dist/`, which is git-ignored. Without this,
      # typecheck/test (which run before the full build) can't resolve it on a clean checkout.
      - name: Build workspace libraries
        run: pnpm --filter "./packages/*" build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # ── Solidity contracts: Foundry build + tests (own toolchain, not npm-managed) ──
  contracts:
    name: contracts (forge build · forge test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Forge build
        run: forge build

      - name: Forge test
        run: forge test -vvv

  # ── Slither static analysis (advisory, non-blocking): reports on the escrow on every push/PR. The two
  #    `timestamp` findings (the deadline comparisons) are triaged accepted-by-design in SECURITY.md, so
  #    this runs with `--fail-none` + `continue-on-error` and can never break the build. Mirrors the
  #    verified local flow (Foundry compile + pip Slither reading contracts/slither.config.json).
  #    verified local flow (contracts/README.md). ──
  slither:
    name: slither (contract static analysis, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Run Slither (advisory — findings triaged in SECURITY.md)
        run: slither . --fail-none
